# Publishes to npm when a GitHub release is published, with npm provenance: npmjs.com shows which commit and
# workflow run built each version, so anyone can check the published code is the code in this repo.
# Auth: npm trusted publishing (OIDC). There is no stored npm token: npm accepts this workflow in this repo only.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # OIDC: trusted publishing and provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5+ is needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
