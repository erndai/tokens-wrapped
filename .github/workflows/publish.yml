# Publishes to npm when a GitHub release is published. The package gets npm provenance: npmjs.com shows which
# commit and workflow run built it, so anyone can check the published code is the code in this repo.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # needed for provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
